<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Device Pairing - OgaPay</title>
<script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('ogapay-theme')||'light')}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>:root{--bg:#ffffff;--bg2:#f7f9fc;--card:#ffffff;--border:#e4e9f1;--text:#101525;--text2:#66738a;--primary:#0d1323;--accent:#7C3AED;--green:#16a34a;--radius:14px;--radius-sm:10px;--nav-h:60px}[data-theme="dark"]{--bg:#080b13;--bg2:#0d111d;--card:#111725;--border:#222b3c;--text:#f4f7fb;--text2:#9aa7bc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}
.nav{position:sticky;top:0;z-index:100;height:var(--nav-h);background:rgba(255,255,255,.92);border-bottom:1px solid var(--border);backdrop-filter:blur(18px)}[data-theme="dark"] .nav{background:rgba(8,11,19,.92)}
.nav-inner{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px;height:100%;width:min(800px,calc(100% - 32px));margin:0 auto}.brand{display:flex;align-items:center;gap:10px;font-family:"Outfit";font-weight:800;font-size:19px}.logo{width:34px;height:34px;border-radius:9px;background:var(--primary);color:var(--bg);display:grid;place-items:center;font-size:18px}
.page{width:min(800px,calc(100% - 32px));margin:0 auto;padding:34px 0 72px;text-align:center}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:40px 32px;max-width:420px;margin:0 auto}.card .qr{width:180px;height:180px;border-radius:16px;background:var(--bg2);border:2px solid var(--border);display:grid;place-items:center;margin:0 auto 20px;font-size:80px;color:var(--text3)}.card h1{font-family:Outfit;font-size:22px;font-weight:800;margin:0}.card p{color:var(--text2);font-size:14px;margin:8px 0 20px}.pair-code{padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;font-family:monospace;font-size:28px;font-weight:800;letter-spacing:8px;color:var(--text);display:inline-block;margin-bottom:20px}.btn{height:44px;padding:0 20px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all .2s;text-decoration:none}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner"><a href="index.html" class="brand"><span class="logo">O</span>OgaPay</a></div></nav>
<main class="page"><div class="card"><div class="qr"><i class="ti ti-device-mobile"></i></div><h1>Pair Your Device</h1><p>Scan the QR code from your mobile device or enter the pairing code below.</p><div class="pair-code">WD8K9M</div><div style="display:flex;gap:8px;justify-content:center"><button class="btn primary"><i class="ti ti-refresh"></i>Generate New Code</button></div><p style="font-size:12px;color:var(--text2);margin-top:16px">Code expires in 5 minutes. One device per pairing.</p></div></main>
</body>
</html>
