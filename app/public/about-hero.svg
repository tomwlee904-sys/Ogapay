<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191C6B"/>
      <stop offset="100%" stop-color="#121566"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="500" height="700" fill="url(#bgGrad)"/>

  <!-- Desk surface -->
  <rect x="20" y="560" width="460" height="12" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="60" y="572" width="14" height="80" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="360" y="572" width="14" height="80" rx="3" fill="rgba(255,255,255,0.06)"/>

  <!-- Laptop base -->
  <rect x="100" y="500" width="220" height="8" rx="3" fill="rgba(255,255,255,0.08)"/>
  <!-- Laptop screen -->
  <rect x="110" y="400" width="200" height="100" rx="8" fill="rgba(255,255,255,0.06)"/>
  <rect x="116" y="406" width="188" height="88" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="120" y="410" width="180" height="80" rx="3" fill="#0a0a2e"/>
  <!-- Screen content -->
  <rect x="128" y="418" width="164" height="5" rx="2" fill="rgba(31,140,255,0.35)"/>
  <rect x="128" y="430" width="130" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="128" y="440" width="150" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="128" y="450" width="100" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="128" y="460" width="140" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="128" y="470" width="80" height="4" rx="2" fill="rgba(31,140,255,0.3)"/>

  <!-- Person - Head -->
  <circle cx="250" cy="90" r="50" fill="rgba(255,255,255,0.1)"/>
  <circle cx="250" cy="90" r="47" fill="rgba(255,190,150,0.18)"/>
  <!-- Hair (natural afro texture) -->
  <ellipse cx="250" cy="62" rx="52" ry="36" fill="rgba(30,20,15,0.5)"/>
  <ellipse cx="250" cy="52" rx="45" ry="28" fill="rgba(30,20,15,0.55)"/>
  <circle cx="220" cy="45" r="14" fill="rgba(30,20,15,0.4)"/>
  <circle cx="250" cy="38" r="16" fill="rgba(30,20,15,0.4)"/>
  <circle cx="280" cy="45" r="13" fill="rgba(30,20,15,0.4)"/>

  <!-- Face -->
  <ellipse cx="236" cy="82" rx="3.5" ry="4" fill="rgba(30,20,15,0.35)"/>
  <ellipse cx="264" cy="82" rx="3.5" ry="4" fill="rgba(30,20,15,0.35)"/>
  <ellipse cx="250" cy="98" rx="7" ry="5" fill="rgba(200,110,80,0.2)"/>
  <!-- Smile -->
  <path d="M240 104 Q250 114 260 104" stroke="rgba(30,20,15,0.25)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Body / blazer -->
  <path d="M190 140 Q190 128 200 128 L300 128 Q310 128 310 140 L315 380 L185 380 Z" fill="rgba(255,255,255,0.1)"/>
  <path d="M200 128 L210 170 L290 170 L300 128" fill="rgba(31,140,255,0.12)"/>
  <!-- Collar -->
  <path d="M240 128 L250 155 L260 128" fill="rgba(255,255,255,0.06)"/>

  <!-- Arms to laptop -->
  <path d="M195 170 Q150 220 175 400 Q180 420 190 415" stroke="rgba(255,190,150,0.25)" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M305 170 Q350 220 325 400 Q320 420 310 415" stroke="rgba(255,190,150,0.25)" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- Hands -->
  <ellipse cx="190" cy="413" rx="10" ry="8" fill="rgba(255,190,150,0.25)"/>
  <ellipse cx="310" cy="413" rx="10" ry="8" fill="rgba(255,190,150,0.25)"/>

  <!-- Decorative circles -->
  <circle cx="60" cy="100" r="22" fill="rgba(31,140,255,0.07)"/>
  <circle cx="440" cy="180" r="18" fill="rgba(22,163,74,0.07)"/>
  <circle cx="50" cy="350" r="14" fill="rgba(31,140,255,0.05)"/>
  <circle cx="450" cy="400" r="12" fill="rgba(22,163,74,0.05)"/>
  <circle cx="80" cy="480" r="10" fill="rgba(255,255,255,0.03)"/>
  <circle cx="420" cy="500" r="8" fill="rgba(31,140,255,0.04)"/>

  <!-- Small dots -->
  <circle cx="100" cy="160" r="3" fill="rgba(255,255,255,0.05)"/>
  <circle cx="400" cy="120" r="3" fill="rgba(255,255,255,0.04)"/>
  <circle cx="470" cy="280" r="2.5" fill="rgba(255,255,255,0.04)"/>
  <circle cx="40" cy="260" r="2" fill="rgba(255,255,255,0.04)"/>
</svg>
