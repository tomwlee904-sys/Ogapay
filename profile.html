*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",system-ui,sans-serif;overflow-x:hidden}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}

.nav-inner{height:100%;display:flex;align-items:center;justify-content:space-between;width:min(900px,calc(100% - 32px));margin:0 auto}.brand{display:flex;align-items:center;gap:8px;font-family:"Outfit";font-weight:800;font-size:17px}.logo{width:30px;height:30px;border-radius:8px;background:var(--primary);color:var(--bg);display:grid;place-items:center;font-size:16px}.nav-links{display:flex;gap:2px}.nav-link{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px;color:var(--text3);font-size:13px;font-weight:600}.nav-link:hover,.nav-link.active{background:var(--bg2);color:var(--text)}.nav-link-featured{background:var(--accent);color:#fff!important;border-radius:999px;padding:6px 14px!important}.nav-link-featured:hover{background:rgba(124,58,237,.85)!important;color:#fff!important}.nav-link-featured i{color:#fff!important}.nav-actions{display:flex;align-items:center;gap:6px}.icon-btn{width:34px;height:34px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);display:grid;place-items:center}.icon-btn:hover{background:var(--bg2);color:var(--text)}.page-wrap{width:min(900px,calc(100% - 32px));margin:0 auto;padding:24px 0 72px}

teX(-50%) translateY(0)}.modal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:all .3s}.modal.open{visibility:visible;opacity:1}.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}.modal-panel{position:relative;width:min(440px,calc(100% - 32px));background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;transform:translateY(20px);transition:all .3s}.modal.open .modal-panel{transform:translateY(0)}.fg{margin-bottom:14px}.fg label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px;display:block}.fg input,.fg select,.fg textarea{width:100%;height:44px;padding:0 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;outline:none}.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent)}.fg-h{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid{display:grid;gap:16px}.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.space{justify-content:space-between}
