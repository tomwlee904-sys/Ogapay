<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Join Test Team - OgaPay</title>
<script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('ogapay-theme')||'light')}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>:root{--bg:#ffffff;--bg2:#f7f9fc;--card:#ffffff;--border:#e4e9f1;--text:#101525;--text2:#66738a;--primary:#0d1323;--accent:#7C3AED;--green:#16a34a;--radius:14px;--radius-sm:10px;--nav-h:60px}[data-theme="dark"]{--bg:#080b13;--bg2:#0d111d;--card:#111725;--border:#222b3c;--text:#f4f7fb;--text2:#9aa7bc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}
.nav{position:sticky;top:0;z-index:100;height:var(--nav-h);background:rgba(255,255,255,.92);border-bottom:1px solid var(--border);backdrop-filter:blur(18px)}[data-theme="dark"] .nav{background:rgba(8,11,19,.92)}
.nav-inner{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px;height:100%;width:min(800px,calc(100% - 32px));margin:0 auto}.brand{display:flex;align-items:center;gap:10px;font-family:"Outfit";font-weight:800;font-size:19px}.logo{width:34px;height:34px;border-radius:9px;background:var(--primary);color:var(--bg);display:grid;place-items:center;font-size:18px}
.page{width:min(800px,calc(100% - 32px));margin:0 auto;padding:34px 0 72px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:32px;text-align:center}.card h1{font-family:Outfit;font-size:28px;font-weight:800;margin:0}.card .sub{color:var(--text2);font-size:14px;margin:6px 0 24px}.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;text-align:center}.perk{padding:16px}.perk .pi{font-size:28px;color:var(--accent);margin-bottom:6px}.perk h3{margin:0;font-size:14px;font-weight:800}.perk p{margin:4px 0 0;font-size:12px;color:var(--text2)}.btn{height:48px;padding:0 28px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all .2s;text-decoration:none}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.primary:hover{box-shadow:0 6px 24px rgba(124,58,237,.3);transform:translateY(-1px)}
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner"><a href="index.html" class="brand"><span class="logo">O</span>OgaPay</a></div></nav>
<main class="page"><div class="card"><h1>Join the Test Team</h1><p class="sub">Get early access to new features, test them before anyone else, and earn rewards for finding bugs.</p>
<div class="perks"><div class="perk"><div class="pi"><i class="ti ti-rocket"></i></div><h3>Early Access</h3><p>Try new features before public launch</p></div><div class="perk"><div class="pi"><i class="ti ti-coin"></i></div><h3>Earn Rewards</h3><p>Get paid for finding and reporting bugs</p></div><div class="perk"><div class="pi"><i class="ti ti-badge"></i></div><h3>Exclusive Badge</h3><p>Show off your Tester badge on your profile</p></div></div>
<button class="btn primary" onclick="alert('Application submitted! We will review and get back to you within 48 hours.')"><i class="ti ti-send"></i>Apply to Join</button></div></main>
</body>
</html>
